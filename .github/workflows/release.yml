name: Release

# Push a tag like v0.4.7 and the addon zip is attached to a GitHub release,
# ready to download on the game PC.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag must match the addon version
        run: |
          toc_version=$(grep -m1 '^## Version:' Lorestar/Lorestar.toc | awk '{print $3}')
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Lorestar.toc version v${toc_version}" >&2
            exit 1
          fi
      - run: scripts/test.sh
      - run: scripts/build.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/Lorestar-v*.zip --title "Lorestar ${GITHUB_REF_NAME}" --generate-notes
