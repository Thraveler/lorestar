name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes do not need a test run.
    paths-ignore: ['*.md', '**/*.md']
  pull_request:
    paths-ignore: ['*.md', '**/*.md']

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  addon-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Tests (Lua with a fake WoW API, Python tools)
        run: scripts/test.sh
      - name: Build the addon zip
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lorestar-addon
          path: dist/Lorestar-v*.zip
          if-no-files-found: error
          # Short on purpose: changes are frequent and old zips are not useful (the default is 90 days).
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
